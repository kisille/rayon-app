services:
  rayon-app:
    build: .
    # Port 3001 nicht direkt exponieren – nginx übernimmt den Zugriff von außen
    expose:
      - "3001"
    environment:
      # Pflichtfeld: Langen zufälligen Schlüssel setzen!
      # Generieren: node -e "console.log(require('crypto').randomBytes(64).toString('hex'))"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein}
      # Produktions-URL eintragen, z.B.: https://rayon.post.at
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN muss gesetzt sein (z.B. https://rayon.post.at)}
      DB_PATH: /data/rayon.db
      PORT: 3001
      # Optional: Initiales Admin-Passwort (nur beim ersten Start)
      # ADMIN_PASSWORT: ${ADMIN_PASSWORT}
    volumes:
      # Datenbankdatei und Backups außerhalb des Containers speichern
      - rayon-daten:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS-Zertifikate: Verzeichnis mit fullchain.pem + privkey.pem mounten
      # Beispiel mit Let's Encrypt (certbot):
      #   - /etc/letsencrypt/live/rayon.post.at:/etc/nginx/certs:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      rayon-app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rayon-daten:
    driver: local
